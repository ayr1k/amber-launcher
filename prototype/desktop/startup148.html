<!doctype html>
<html lang="en-US"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'"><title>AMBER</title><style>
:root{--background:#f8faf7;--text:#193b30;--muted:#596e64;--accent:#245b48;--radius:0px;--font-size:14px;color-scheme:light dark}
*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--text);font:var(--font-size)/1.55 'Segoe UI','Microsoft YaHei',sans-serif;user-select:none;-webkit-app-region:drag;min-height:100vh;display:grid;place-items:center;padding:28px}
main{width:100%;max-width:380px;border-radius:var(--radius)}header{display:flex;align-items:center;gap:14px;margin-bottom:22px}img{width:40px;height:40px}h1{font-size:26px;letter-spacing:.09em;margin:0}p{margin:8px 0;overflow-wrap:anywhere}#status{min-height:2em}#slow{font-size:12px;color:var(--muted)}.track{height:3px;background:var(--muted);opacity:.6;border-radius:var(--radius);overflow:hidden}.track:before{content:'';display:block;width:30%;height:100%;background:var(--text);animation:working 1.4s ease-in-out infinite alternate}@keyframes working{to{transform:translateX(230%)}}@media(prefers-reduced-motion:reduce){.track:before{animation:none}}[data-motion=off] .track:before{animation:none}
</style></head><body><main><header><img src="../dist/client/brand/amber-mark.svg" alt=""><h1 id="brand">AMBER</h1></header><p id="status" role="status" aria-live="polite">Loading application…</p><div class="track" aria-hidden="true"></div><p id="slow" hidden>Still working. Please wait.</p></main></body></html>
