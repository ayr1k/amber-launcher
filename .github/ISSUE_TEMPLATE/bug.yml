name: 问题反馈
description: 报告启动、下载或界面问题
body:
  - type: markdown
    attributes:
      value: 请不要提交账号、令牌或完整的私人文件路径。可在“关于 AMBER”导出不含账号和日志的诊断摘要，并先检查文件内容。
  - type: input
    id: version
    attributes:
      label: AMBER 版本与 Windows 版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 如何重现
      description: 游戏版本、加载器、操作步骤，以及实际发生了什么。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望的结果
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断摘要或已脱敏的错误信息
