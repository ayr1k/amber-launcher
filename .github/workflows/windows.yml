name: All-platform packages and Windows tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - run: test -x prototype/desktop/bin/seed-engine-linux-x64
      - run: node --test prototype/tests/seed-native162.test.mjs prototype/tests/seed162.test.mjs prototype/tests/seed161.test.mjs
      - run: node --test prototype/tests/editor163.test.mjs prototype/tests/memory164.test.mjs
  desktop:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
          package_json_file: prototype/package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - name: Canonicalize Windows temporary directory
        shell: pwsh
        run: |
          node --input-type=module -e "import {realpathSync,appendFileSync} from 'node:fs'; import {tmpdir} from 'node:os'; const p=realpathSync.native(tmpdir()); console.log('Canonical temporary directory:',p); appendFileSync(process.env.GITHUB_ENV,'TEMP='+p+'\nTMP='+p+'\n');"
      - name: Run regression tests with bounded concurrency
        shell: pwsh
        run: |
          # Warm Windows PowerShell before the bounded process-start probe.
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -Command "Get-Process -Id $PID | Out-Null"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testFiles = ((Get-Content package.json -Raw | ConvertFrom-Json).scripts.test -replace '^node --test ', '') -split ' '
          node --test --test-concurrency=2 @testFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: pnpm build
      - run: pnpm test:sites
      - run: pnpm release:check
      - run: pnpm desktop:smoke
      - name: Build existing main platform artifacts
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: pnpm package:all --public
        env:
          AMBER_CURSEFORGE_API_KEY: ${{ secrets.AMBER_CURSEFORGE_API_KEY }}
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: amber-all-platforms
          path: |
            prototype/releases/*/*-Setup-x64.exe
            prototype/releases/*/*.zip
            prototype/releases/*/*.deb
            prototype/releases/*/*.tar.gz
            prototype/releases/*/*.sha256
            prototype/releases/*/*.provenance.json
          retention-days: 30
          if-no-files-found: error
