name: Windows build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
          package_json_file: prototype/package.json
      - run: pnpm install --frozen-lockfile
      - name: Canonicalize Windows temporary directory
        shell: pwsh
        run: |
          node --input-type=module -e "import {realpathSync,appendFileSync} from 'node:fs'; import {tmpdir} from 'node:os'; const p=realpathSync.native(tmpdir()); console.log('Canonical temporary directory:',p); appendFileSync(process.env.GITHUB_ENV,'TEMP='+p+'\nTMP='+p+'\n');"
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:sites
      - run: pnpm release:check
      - run: pnpm desktop:smoke
      - run: pnpm package:desktop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: amber-windows-development
          path: prototype/releases/AMBER-*-win-x64
          retention-days: 7
          if-no-files-found: error
